<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#080b10">
  <title>Hacky Sack Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="display"></canvas>
    <video id="camera" autoplay muted playsinline></video>

    <section id="topBar">
      <div class="pill"><span id="statusDot"></span><span id="status">Press Start</span></div>
      <div class="pill"><span id="fps">0.0 FPS</span></div>
    </section>

    <section id="counterPanel">
      <span class="counterLabel">Estimated touches</span>
      <strong id="counter">0</strong>
    </section>

    <section id="controls">
      <label class="controlRow">
        <span>Confidence</span>
        <span id="confidenceValue">35%</span>
      </label>
      <input id="confidence" type="range" min="10" max="90" value="35" step="1">
      <div class="buttonRow">
        <button id="startButton" class="primary">Start camera</button>
        <button id="resetButton">Reset count</button>
      </div>
    </section>

    <div id="message" hidden></div>
  </main>

  <canvas id="modelCanvas" width="320" height="320"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  <script src="app.js?v=43"></script>
</body>
</html>
